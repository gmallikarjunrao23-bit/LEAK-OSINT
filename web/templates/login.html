<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeakOSINT Pro — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(ellipse at 30% 40%, rgba(88,28,135,0.2) 0%, transparent 60%);
        }
        .login-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
        }
        .login-card h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card p { text-align: center; color: rgba(255,255,255,0.3); margin: 8px 0 32px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }
        .form-group input:focus { border-color: rgba(124,58,237,0.4); }
        .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #7c3aed, #06b6d4); border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(124,58,237,0.3); }
        .error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 12px; padding: 12px 16px; color: #ef4444; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>✦ LeakOSINT Pro</h1>
        <p>Admin Access Only</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Telegram ID</label>
                <input type="number" name="telegram_id" placeholder="Enter your Telegram ID" required>
            </div>
            <button type="submit" class="btn">→ Authorize</button>
        </form>
    </div>
</body>
</html>
